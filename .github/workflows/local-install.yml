name: Official local installation

on:
  workflow_dispatch:
  push:
    branches: [francis-config]
    paths:
      - .github/workflows/local-install.yml
  pull_request:
    paths:
      - .github/workflows/local-install.yml

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CODEX_INSTALLER_USE_RELEASES_OPENAI_COM: "false"
      CODEX_NON_INTERACTIVE: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install official Codex on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -fsSL https://chatgpt.com/codex/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install official Codex on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://chatgpt.com/codex/install.ps1 | iex
          "$env:LOCALAPPDATA\Programs\OpenAI\Codex\bin" >> $env:GITHUB_PATH
      - name: Install the official GPT-6-capable LazyCodex beta
        shell: pwsh
        run: |
          npx --yes lazycodex-ai@5.0.0-beta.60 install --no-tui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installed CLI and LazyCodex payload
        shell: pwsh
        run: |
          codex --version
          if ($LASTEXITCODE -ne 0) { throw "Codex version failed" }
          codex --help
          if ($LASTEXITCODE -ne 0) { throw "Codex help failed" }
          codex --invalid-installation-test-option
          if ($LASTEXITCODE -eq 0) { throw "Codex accepted an invalid option" }
          $root = "$HOME/.codex/plugins/cache/sisyphuslabs/omo/5.0.0-beta.60"
          $plugin = Get-Content "$root/.codex-plugin/plugin.json" -Raw | ConvertFrom-Json
          if ($plugin.name -ne 'omo' -or $plugin.version -ne '5.0.0-beta.60') { throw "Unexpected plugin" }
          "LazyCodex $($plugin.version)"
          $catalog = Get-Content "$root/model-catalog.json" -Raw | ConvertFrom-Json
          if ($catalog.current.model -ne 'gpt-6-astra') { throw "GPT-6 default missing" }
          if (-not (Test-Path (Join-Path $root $plugin.skills))) { throw "Skills missing" }
          foreach ($hook in $plugin.hooks) {
            Get-Content (Join-Path $root $hook) -Raw | ConvertFrom-Json | Out-Null
          }
          $global:LASTEXITCODE = 0
